services:
  - type: web
    name: calendar-386
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-386-db
          property: connectionString

databases:
  - name: calendar-386-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
