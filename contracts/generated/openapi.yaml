openapi: 3.0.0
info:
  title: Календарь звонков API
  version: 0.0.0
tags: []
paths:
  /:
    get:
      operationId: getStatus
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
  /api/event-types:
    get:
      operationId: EventTypes_listEventTypes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventType'
                required:
                  - items
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/event-types/{id}:
    get:
      operationId: EventTypes_getEventType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/owner/availability:
    get:
      operationId: OwnerAvailability_getAvailability
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: OwnerAvailability_saveAvailability
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAvailability'
  /api/owner/event-types:
    post:
      operationId: createEventType
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTypeCreated'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventType'
  /api/owner/operations/{key}:
    get:
      operationId: getOwnerOperation
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResult'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/owner/session:
    get:
      operationId: OwnerSession_getOwnerSession
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: OwnerSession_loginOwner
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
                format: int32
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
    delete:
      operationId: OwnerSession_logoutOwner
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - OWNER_AUTH_REQUIRED
            - INVALID_PASSWORD
            - ORIGIN_NOT_ALLOWED
            - OWNER_NOT_CONFIGURED
            - LOGIN_RATE_LIMITED
            - TEMPORARILY_UNAVAILABLE
            - INTERNAL_ERROR
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - EVENT_TYPE_NOT_FOUND
            - REVISION_CONFLICT
            - PREVIEW_REQUIRED
        message:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
            required:
              - field
              - code
              - message
        retryAfterSeconds:
          type: integer
          format: int32
    AvailabilityResponse:
      type: object
      required:
        - availability
        - serverNow
      properties:
        availability:
          $ref: '#/components/schemas/AvailabilitySettings'
        serverNow:
          type: string
    AvailabilitySettings:
      type: object
      required:
        - configured
        - timeZone
        - revision
        - days
      properties:
        configured:
          type: boolean
        timeZone:
          type: string
          nullable: true
        revision:
          type: integer
          format: int32
        days:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyDay'
          description: 'Ровно семь неповторяющихся дней: понедельник 1 — воскресенье 7.'
    CreateEventType:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          pattern: ^[^\u0000]*$
          description: 'Название после trim: 1–100 кодовых точек; U+0000 запрещён.'
        description:
          type: string
          pattern: ^[^\u0000]*$
          description: До 2000 кодовых точек; переносы сохраняются, U+0000 запрещён.
        durationMinutes:
          type: integer
          format: int32
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
    EventTypeCreated:
      type: object
      required:
        - eventType
      properties:
        eventType:
          $ref: '#/components/schemas/EventType'
    OperationResponse:
      type: object
      required:
        - status
        - body
      properties:
        status:
          type: integer
          format: int32
        body:
          anyOf:
            - $ref: '#/components/schemas/EventTypeCreated'
            - $ref: '#/components/schemas/AvailabilityResponse'
            - $ref: '#/components/schemas/ApiError'
    OperationResult:
      anyOf:
        - type: object
          properties:
            state:
              type: string
              enum:
                - unknown
          required:
            - state
        - type: object
          properties:
            state:
              type: string
              enum:
                - completed
            response:
              $ref: '#/components/schemas/OperationResponse'
          required:
            - state
            - response
    SaveAvailability:
      type: object
      required:
        - revision
        - timeZone
        - days
      properties:
        revision:
          type: integer
          format: int32
          minimum: 0
        timeZone:
          type: string
        days:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyDay'
          description: 'Ровно семь неповторяющихся дней: понедельник 1 — воскресенье 7.'
        confirmationToken:
          type: string
    Session:
      type: object
      required:
        - authenticated
        - expiresAt
        - serverNow
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: string
          nullable: true
        serverNow:
          type: string
    SessionStatus:
      type: object
      required:
        - configured
      properties:
        configured:
          type: boolean
      allOf:
        - $ref: '#/components/schemas/Session'
    WeeklyDay:
      type: object
      required:
        - weekday
        - intervals
      properties:
        weekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/WorkingInterval'
    WorkingInterval:
      type: object
      required:
        - startMinute
        - endMinute
      properties:
        startMinute:
          type: integer
          format: int32
          minimum: 0
          maximum: 1439
        endMinute:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
servers:
  - url: http://127.0.0.1:3000
    description: Локальная разработка
    variables: {}
